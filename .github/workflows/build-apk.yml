# Build OpenRA Android APK (arm64-v8a only)
#
# Builds native libraries (SDL2, OpenAL-soft, FreeType, Lua 5.1) from source
# using Android NDK r27c, then publishes the .NET Android APK.
#
# Caches: NDK, native .so, NuGet, workload, Android SDK, MSBuild obj

name: Build Android APK

on:
  push:
    branches: [main, master, android-port, bleed]
    paths:
      - "OpenRA.Game/**"
      - "OpenRA.Mods.Common/**"
      - "OpenRA.Mods.Cnc/**"
      - "OpenRA.Mods.D2k/**"
      - "OpenRA.AndroidLauncher/**"
      - "OpenRA.Platforms.Android/**"
      - "mods/**"
      - "glsl/**"
      - "native/android/**"
      - "scripts/package-android-assets.sh"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [main, master, android-port, bleed]
    paths:
      - "OpenRA.Game/**"
      - "OpenRA.Mods.Common/**"
      - "OpenRA.Mods.Cnc/**"
      - "OpenRA.Mods.D2k/**"
      - "OpenRA.AndroidLauncher/**"
      - "OpenRA.Platforms.Android/**"
      - "mods/**"
      - "glsl/**"
      - "native/android/**"
      - "scripts/package-android-assets.sh"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Debug
          - Release

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  RID: android-arm64
  TFM: net10.0-android
  PROJECT_ROOT: ${{ github.workspace }}
  LAUNCHER_CSPROJ: OpenRA.AndroidLauncher/OpenRA.AndroidLauncher.csproj
  NDK_VERSION: r27c
  SDL2_VERSION: 2.30.9
  OPENAL_VERSION: 1.23.1
  FREETYPE_VERSION: 2.13.2
  LUA_VERSION: 5.1.5
  OpenRAAndroid: true

jobs:
  build-apk:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # required to create/update releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "microsoft"
          java-version: "17"

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/android-ndk-${{ env.NDK_VERSION }}
          key: ndk-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ hashFiles('.github/workflows/build-apk.yml') }}

      - name: Download Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          NDK_ZIP="android-ndk-${{ env.NDK_VERSION }}-linux.zip"
          echo "Downloading NDK ${{ env.NDK_VERSION }} ..."
          wget --progress=dot:giga "https://dl.google.com/android/repository/$NDK_ZIP"
          echo "Extracting NDK ..."
          unzip -q "$NDK_ZIP"
          rm "$NDK_ZIP"
          ls -d android-ndk-${{ env.NDK_VERSION }}

      - name: Check for prebuilt native libraries
        id: check-native
        run: |
          NATIVE_DIR="native/android/arm64-v8a"
          if [ -f "$NATIVE_DIR/libSDL2.so" ] && \
             [ -f "$NATIVE_DIR/libopenal.so" ] && \
             [ -f "$NATIVE_DIR/libfreetype.so" ] && \
             [ -f "$NATIVE_DIR/liblua5.1.so" ]; then
            echo "prebuilt=true" >> "$GITHUB_OUTPUT"
            echo "Prebuilt native libraries found — skipping source build"
          else
            echo "prebuilt=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache built native libraries
        id: cache-native
        uses: actions/cache@v4
        with:
          path: native/android/arm64-v8a
          key: native-libs-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-sdl${{ env.SDL2_VERSION }}-openal${{ env.OPENAL_VERSION }}-ft${{ env.FREETYPE_VERSION }}-lua${{ env.LUA_VERSION }}-${{ hashFiles('.github/workflows/build-apk.yml') }}

      - name: Build native libraries from source
        if: steps.cache-native.outputs.cache-hit != 'true' && steps.check-native.outputs.prebuilt != 'true'
        run: |
          set -e
          export NDK="${{ github.workspace }}/android-ndk-${{ env.NDK_VERSION }}"
          export ANDROID_NDK_HOME="$NDK"
          export ANDROID_NDK_ROOT="$NDK"
          export TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          export TARGET="aarch64-linux-android26"
          export CC="$TOOLCHAIN/bin/$TARGET-clang"
          export CXX="$TOOLCHAIN/bin/$TARGET-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export CMAKE_WARN_DEPRECATED=OFF

          OUT_DIR="${{ github.workspace }}/native/android/arm64-v8a"
          mkdir -p "$OUT_DIR"
          BUILD_DIR="${{ github.workspace }}/native-build"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"

          if [ ! -f "$OUT_DIR/libSDL2.so" ]; then
            echo "=== Building SDL2 ${{ env.SDL2_VERSION }} ==="
            curl -fsSL -o "SDL2-${{ env.SDL2_VERSION }}.tar.gz" \
              "https://github.com/libsdl-org/SDL/releases/download/release-${{ env.SDL2_VERSION }}/SDL2-${{ env.SDL2_VERSION }}.tar.gz"
            tar xzf "SDL2-${{ env.SDL2_VERSION }}.tar.gz"
            cmake -S "SDL2-${{ env.SDL2_VERSION }}" -B sdl2-build \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-26 \
              -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
              -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384" \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DSDL_TESTS=OFF \
              -DSDL_SHARED=ON \
              -DSDL_STATIC=OFF
            cmake --build sdl2-build --parallel "$(nproc)"
            cp sdl2-build/libSDL2*.so* "$OUT_DIR/" 2>/dev/null || find sdl2-build -maxdepth 1 -name "libSDL2*.so*" -exec cp {} "$OUT_DIR/" \;
          fi

          if [ ! -f "$OUT_DIR/libopenal.so" ]; then
            echo "=== Building OpenAL-soft ${{ env.OPENAL_VERSION }} ==="
            if curl -fsSL -A "Mozilla/5.0" -o "openal-soft-${{ env.OPENAL_VERSION }}.tar.bz2" \
               "https://github.com/kcat/openal-soft/releases/download/${{ env.OPENAL_VERSION }}/openal-soft-${{ env.OPENAL_VERSION }}.tar.bz2"; then
              tar xf "openal-soft-${{ env.OPENAL_VERSION }}.tar.bz2"
            else
              curl -fsSL -A "Mozilla/5.0" -o "openal-soft-${{ env.OPENAL_VERSION }}.tar.gz" \
                "https://github.com/kcat/openal-soft/archive/refs/tags/${{ env.OPENAL_VERSION }}.tar.gz"
              tar xzf "openal-soft-${{ env.OPENAL_VERSION }}.tar.gz"
            fi
            cmake -S "openal-soft-${{ env.OPENAL_VERSION }}" -B openal-build \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-26 \
              -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
              -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384" \
              -DCMAKE_BUILD_TYPE=Release \
              -DLIBTYPE=SHARED \
              -DALSOFT_UTILS=OFF \
              -DALSOFT_EXAMPLES=OFF
            cmake --build openal-build --parallel "$(nproc)"
            cp openal-build/libopenal.so "$OUT_DIR/"
          fi

          if [ ! -f "$OUT_DIR/libfreetype.so" ]; then
            echo "=== Building FreeType ${{ env.FREETYPE_VERSION }} ==="
            curl -fsSL -o "freetype-${{ env.FREETYPE_VERSION }}.tar.xz" \
              "https://github.com/freetype/freetype/releases/download/VER-${{ env.FREETYPE_VERSION }}/freetype-${{ env.FREETYPE_VERSION }}.tar.xz" || \
            curl -fsSL -o "freetype-${{ env.FREETYPE_VERSION }}.tar.xz" \
              "https://download.savannah.gnu.org/releases/freetype/freetype-${{ env.FREETYPE_VERSION }}.tar.xz" || \
            curl -fsSL -L -o "freetype-${{ env.FREETYPE_VERSION }}.tar.xz" \
              "https://sourceforge.net/projects/freetype/files/freetype2/${{ env.FREETYPE_VERSION }}/freetype-${{ env.FREETYPE_VERSION }}.tar.xz/download"
            tar xf "freetype-${{ env.FREETYPE_VERSION }}.tar.xz"
            cmake -S "freetype-${{ env.FREETYPE_VERSION }}" -B freetype-build \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-26 \
              -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
              -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384" \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DFT_DISABLE_HARFBUZZ=ON \
              -DFT_DISABLE_BROTLI=ON
            cmake --build freetype-build --parallel "$(nproc)"
            cp freetype-build/libfreetype.so "$OUT_DIR/"
          fi

          if [ ! -f "$OUT_DIR/liblua5.1.so" ]; then
            echo "=== Building Lua ${{ env.LUA_VERSION }} ==="
            curl -fsSL -o "lua-${{ env.LUA_VERSION }}.tar.gz" \
              "https://www.lua.org/ftp/lua-${{ env.LUA_VERSION }}.tar.gz"
            tar xzf "lua-${{ env.LUA_VERSION }}.tar.gz"
            cd "lua-${{ env.LUA_VERSION }}"
            make -C src liblua.a \
              CC="$CC" \
              AR="$AR rcu" \
              RANLIB="$RANLIB" \
              MYCFLAGS="-fPIC -O2 -D__ANDROID__"
            "$CC" -shared -fPIC -Wl,-z,max-page-size=16384 -o liblua5.1.so src/*.o -lm
            cp "liblua5.1.so" "$OUT_DIR/"
          fi

          # Eluant DllImport("lua51") alias
          if [ -f "$OUT_DIR/liblua5.1.so" ] && [ ! -f "$OUT_DIR/liblua51.so" ]; then
            cp "$OUT_DIR/liblua5.1.so" "$OUT_DIR/liblua51.so"
          fi
          # Strip debug symbols from all .so (smaller APK)
          STRIP="$TOOLCHAIN/bin/llvm-strip"
          if [ -x "$STRIP" ]; then
            echo "=== Stripping native libraries ==="
            for so in "$OUT_DIR"/*.so; do
              [ -f "$so" ] || continue
              echo "strip $so"
              "$STRIP" --strip-unneeded "$so" || "$STRIP" -S "$so" || true
            done
          else
            echo "llvm-strip not found at $STRIP — skip"
          fi
          echo "=== Native libraries built ==="
          ls -la "$OUT_DIR/"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.NUGET_PACKAGES }}
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-net10-${{ hashFiles('**/*.csproj', '**/packages.lock.json', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-net10-

      - name: Cache .NET Android workload
        id: cache-workload
        uses: actions/cache@v4
        with:
          path: |
            ~/.dotnet/sdk-manifests
            ~/.dotnet/library-packs
            ~/.dotnet/template-packs
            ~/.dotnet/workloads
            ~/.dotnet/packs
          key: dotnet-workload-android-${{ runner.os }}-net10-${{ hashFiles('.github/workflows/build-apk.yml') }}
          restore-keys: |
            dotnet-workload-android-${{ runner.os }}-net10-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}
            ~/.android/cache
            ~/.android/build-cache
          key: android-sdk-${{ runner.os }}-api35-${{ hashFiles('.github/workflows/build-apk.yml') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-api35-

      - name: Cache MSBuild intermediates (obj)
        uses: actions/cache@v4
        with:
          path: |
            OpenRA.Game/obj
            OpenRA.AndroidLauncher/obj
            OpenRA.Platforms.Android/obj
            OpenRA.Mods.Common/obj
            OpenRA.Mods.Cnc/obj
            OpenRA.Mods.D2k/obj
          key: msbuild-obj-${{ runner.os }}-android-${{ hashFiles('**/*.csproj', '**/*.cs', 'Directory.Build.props') }}
          restore-keys: |
            msbuild-obj-${{ runner.os }}-android-

      - name: Install Android workload
        run: |
          if [ "${{ steps.cache-workload.outputs.cache-hit }}" = "true" ]; then
            dotnet workload install android --skip-manifest-update || dotnet workload install android
          else
            dotnet workload install android
          fi
          dotnet workload list

      - name: Ensure Android SDK components
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0" || true
          else
            echo "ANDROID_HOME/sdkmanager not fully available yet — workload will provision as needed"
          fi

      - name: Restore
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if [ ! -f "${LAUNCHER_CSPROJ}" ]; then
            echo "Launcher csproj not found at ${LAUNCHER_CSPROJ}"
            ls -la
            exit 1
          fi

          # Drop any cached desktop-only assets so restore can write net10.0-android
          if [ -d OpenRA.Game/obj ]; then
            echo "Clearing OpenRA.Game/obj to avoid stale TFM assets ..."
            rm -rf OpenRA.Game/obj
          fi

          if [ -f OpenRA.Game/OpenRA.Game.csproj ]; then
            echo "Restoring OpenRA.Game for net10.0-android (OpenRAAndroid=true) ..."
            dotnet restore OpenRA.Game/OpenRA.Game.csproj \
              /p:OpenRAAndroid=true \
              --force \
              --verbosity minimal
            # Assets must list net10.0-android only when OpenRAAndroid=true (not net10.0)

            # Sanity-check that assets include the Android TFM
            ASSETS="OpenRA.Game/obj/project.assets.json"
            if [ -f "$ASSETS" ]; then
              if grep -q "net10.0-android" "$ASSETS"; then
                echo "OK: project.assets.json contains net10.0-android"
              else
                echo "ERROR: project.assets.json missing net10.0-android target"
                echo "TargetFramework resolution may be wrong. Dumping relevant lines:"
                grep -E "target|net10" "$ASSETS" | head -40 || true
                exit 1
              fi
            else
              echo "ERROR: $ASSETS was not created"
              exit 1
            fi
          else
            echo "WARNING: OpenRA.Game/OpenRA.Game.csproj not found — skip engine restore"
          fi

          echo "Restoring launcher ..."
          dotnet restore "${LAUNCHER_CSPROJ}" /p:OpenRAAndroid=true --verbosity minimal

      - name: Build Engine
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          CONFIG="${{ github.event.inputs.configuration || 'Release' }}"
          if [ ! -f OpenRA.Game/OpenRA.Game.csproj ]; then
            echo "OpenRA.Game.csproj missing — skip engine build"
            exit 0
          fi
          # Do not use --no-restore here: property must match restore TFM every time
          dotnet build OpenRA.Game/OpenRA.Game.csproj \
            -c "$CONFIG" \
            /p:OpenRAAndroid=true \
            --verbosity minimal

      - name: Build mod assemblies (desktop TFM)
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          CONFIG="${{ github.event.inputs.configuration || 'Release' }}"
          set -euo pipefail
          # Mod DLLs are managed assemblies; build net10.0 (not android) for packaging into Assets
          for proj in OpenRA.Mods.Common OpenRA.Mods.Cnc; do
            if [ -f "$proj/$proj.csproj" ]; then
              echo "=== Building $proj ($CONFIG) ==="
              # OpenRAAndroid=false so Directory.Build.props keeps net10.0 (not android)
              dotnet build "$proj/$proj.csproj" \
                -c "$CONFIG" \
                -f net10.0 \
                /p:OpenRAAndroid=false \
                /p:CopyLocalLockFileAssemblies=true \
                --verbosity minimal
            else
              echo "Skip missing $proj"
            fi
          done

      - name: Package Android assets (mods, glsl, assemblies)
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          CONFIG="${{ github.event.inputs.configuration || 'Release' }}"
          chmod +x scripts/package-android-assets.sh
          # Package FULL mod trees + assemblies from the same tree that built the DLLs.
          # Fixes ruleset errors like: v2rl Chronoshiftable requires Mobile or Husk
          # (caused by incomplete YAML or DLL/YAML version skew).
          ./scripts/package-android-assets.sh \
            "${{ github.workspace }}" \
            "OpenRA.AndroidLauncher/Assets" \
            "$CONFIG"

          # Extra guard: rules files required for RA ruleset validation
          ASSETS="OpenRA.AndroidLauncher/Assets"
          test -f "$ASSETS/mods/ra/rules/vehicles.yaml"
          test -f "$ASSETS/mods/ra/rules/defaults.yaml"
          test -f "$ASSETS/mods/common/mod.yaml"
          test -f "$ASSETS/assemblies/OpenRA.Mods.Common.dll"
          test -f "$ASSETS/assemblies/OpenRA.Mods.Cnc.dll"
          echo "Workflow packaging OK"

      - name: Build Launcher
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          CONFIG="${{ github.event.inputs.configuration || 'Release' }}"
          echo "Building launcher: $CONFIG"
          dotnet build "${LAUNCHER_CSPROJ}" \
            -c "$CONFIG" \
            -f ${{ env.TFM }} \
            /p:OpenRAAndroid=true \
            -p:RuntimeIdentifier=${{ env.RID }} \
            --verbosity minimal

      - name: Publish APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          CONFIG="${{ github.event.inputs.configuration || 'Release' }}"
          OUT_DIR="${{ github.workspace }}/artifacts-apk"
          mkdir -p "$OUT_DIR"
          dotnet publish "${LAUNCHER_CSPROJ}" \
            -c "$CONFIG" \
            -f ${{ env.TFM }} \
            /p:OpenRAAndroid=true \
            -p:RuntimeIdentifier=${{ env.RID }} \
            -p:AndroidPackageFormat=apk \
            -p:PublishTrimmed=false \
            -p:RunAOTCompilation=false \
            -o "$OUT_DIR" \
            --verbosity minimal
          find "$OUT_DIR" -type f \( -name "*.apk" -o -name "*.aab" \) -print || true


      - name: Strip published native libraries
        run: |
          set -euo pipefail
          NDK_ROOT="${{ env.ANDROID_NDK_HOME }}"
          STRIP=$(find "$NDK_ROOT" -name llvm-strip -type f 2>/dev/null | head -1 || true)
          if [ -z "$STRIP" ]; then
            echo "llvm-strip not found — skip"
            exit 0
          fi
          OUT_DIR="${{ github.workspace }}/artifacts-apk"
          # Strip any .so produced under publish / intermediate
          find "$OUT_DIR" "${{ env.PROJECT_ROOT }}" -type f -name "*.so" 2>/dev/null | while read -r so; do
            echo "strip $so"
            "$STRIP" --strip-unneeded "$so" 2>/dev/null || "$STRIP" -S "$so" 2>/dev/null || true
          done

      - name: Collect APK
        id: collect
        run: |
          OUT_DIR="${{ github.workspace }}/artifacts-apk"
          APK=$(find "$OUT_DIR" -name "*-Signed.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find "$OUT_DIR" -name "*.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "No APK found under $OUT_DIR"
            find "$OUT_DIR" -type f || true
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          DEST="${{ github.workspace }}/OpenRA-android-arm64-${SHORT_SHA}.apk"
          cp "$APK" "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          echo "Found APK: $DEST ($(du -h "$DEST" | cut -f1))"

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: android-nightly
          name: Android Nightly Build (${{ github.ref_name }})
          body: |
            Automated Android build from commit `${{ github.sha }}`.
            - **Branch:** ${{ github.ref_name }}
            - **Configuration:** ${{ github.event.inputs.configuration || 'Release' }}
            - **ABI:** arm64-v8a
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: false
          artifacts: ${{ steps.collect.outputs.apk_path }}
          token: ${{ secrets.GITHUB_TOKEN }}
